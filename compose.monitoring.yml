# Linux host resource monitoring. On Docker Desktop these are Linux VM resources.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.path=/prometheus',
        '--storage.tsdb.retention.time=15d',
      ]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD}
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 384m
    cpus: 0.5
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      [
        '--path.rootfs=/host',
        '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)',
      ]
    volumes: ['/:/host:ro']
    mem_limit: 64m
    cpus: 0.25
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    devices: ['/dev/kmsg:/dev/kmsg']
    # Host disk capacity comes from node_exporter. Disable per-container disk
    # collection to support Docker 29's containerd snapshotter as well as overlay2.
    command:
      [
        '--docker_only=true',
        '--housekeeping_interval=15s',
        '--disable_metrics=disk',
        '--store_container_labels=false',
        '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project',
      ]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    mem_limit: 256m
    cpus: 0.5
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes: ['./infra/monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro']
    mem_limit: 64m
    cpus: 0.25

volumes:
  prometheus-data:
  grafana-data:
